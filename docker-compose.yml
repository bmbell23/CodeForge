version: '3.8'

services:
  codeforge:
    build: .
    container_name: codeforge_app
    restart: unless-stopped
    network_mode: host
    volumes:
      # Mount projects directory
      - /home/brandon/projects:/app/projects
      # Mount augment config so auggie uses host's auth session
      - /home/brandon/.augment:/home/codeforge/.augment
      # Mount Docker socket so auggie can run docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount data directory for database and uploads
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      # Application settings
      - HOST=0.0.0.0
      - PORT=8005
      - PROJECTS_ROOT=/app/projects

      # Database (SQLite in data directory)
      - DATABASE_URL=sqlite:///./data/codeforge.db

      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200

      # Augment CLI settings
      - AUGGIE_PATH=/usr/bin/auggie
      - NODE_PATH=/usr/bin/node
      - USE_MOCK_AUGMENT=${USE_MOCK_AUGMENT:-false}
      # AUGMENT_SESSION_AUTH is read from mounted ~/.augment/session.json

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  codeforge_data:
    driver: local
