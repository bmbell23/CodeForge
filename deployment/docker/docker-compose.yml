version: '3.8'

services:
  codeforge:
    build: .
    container_name: codeforge_app
    restart: unless-stopped
    ports:
      - "8009:8000"  # Map container port 8000 to host port 8009
    volumes:
      # Mount projects directory (read-only for security)
      - /home/brandon/projects:/app/projects:ro
      # Mount data directory for database and uploads
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      # Application settings
      - HOST=0.0.0.0
      - PORT=8000
      - PROJECTS_ROOT=/app/projects

      # Database (SQLite in data directory)
      - DATABASE_URL=sqlite:///./data/codeforge.db

      # Security
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200

      # Augment CLI settings
      - AUGGIE_PATH=/usr/bin/auggie
      - NODE_PATH=/usr/bin/node
      - USE_MOCK_AUGMENT=${USE_MOCK_AUGMENT:-false}
      - AUGMENT_SESSION_AUTH={"accessToken":"bd12f874d550c08b23bc444f7143a9ce988f1cd1e8ed07c731f031ea99d1cbf1","tenantURL":"https://e2.api.augmentcode.com/","scopes":["read","write"]}

    networks:
      - codeforge_network

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  codeforge_network:
    driver: bridge

volumes:
  codeforge_data:
    driver: local
