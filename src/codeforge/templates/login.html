{% extends "base.html" %}

{% block title %}Login - CodeForge{% endblock %}

{% block body %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-gray-900 via-black to-gray-900">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <div class="flex justify-center mb-4">
                <div class="w-20 h-20 bg-gradient-to-br from-forge-green-500 to-forge-green-700 rounded-2xl flex items-center justify-center shadow-2xl shadow-forge-green-900/50">
                    <i class="fas fa-code text-4xl text-white"></i>
                </div>
            </div>
            <h2 class="mt-6 text-center text-4xl font-extrabold">
                <span class="text-gradient-green">CodeForge</span>
            </h2>
            <p class="mt-2 text-center text-sm text-gray-400 flex items-center justify-center gap-2">
                <i class="fas fa-bolt text-forge-green-400"></i>
                Web-based IDE powered by Augment
            </p>
        </div>

        <div class="mt-8 bg-gray-900 border border-gray-800 py-8 px-4 shadow-2xl rounded-2xl sm:px-10">
            <form class="space-y-6" id="loginForm">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fas fa-user text-forge-green-400"></i>
                        Username
                    </label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-700 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-forge-green-500 focus:border-forge-green-500 bg-gray-800 text-white sm:text-sm transition-all">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 flex items-center gap-2">
                        <i class="fas fa-lock text-forge-green-400"></i>
                        Password
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required
                            class="appearance-none block w-full px-4 py-3 border border-gray-700 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-forge-green-500 focus:border-forge-green-500 bg-gray-800 text-white sm:text-sm transition-all">
                    </div>
                </div>

                <div id="errorMessage" class="hidden text-red-400 text-sm bg-red-900/20 border border-red-800 rounded-lg p-3 flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-gradient-to-r from-forge-green-600 to-forge-green-700 hover:from-forge-green-500 hover:to-forge-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forge-green-500 transition-all hover:-translate-y-0.5 shadow-forge-green-900/50">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign in
                    </button>
                </div>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 text-gray-400">
                            Don't have an account?
                            <a href="/code/register" class="font-medium text-forge-green-400 hover:text-forge-green-300 transition-colors">
                                Register
                            </a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Detect if we're running under /code/ prefix
const BASE_PATH = window.location.pathname.startsWith('/code/') ? '/code' : '';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');

    try {
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch(`${BASE_PATH}/api/auth/login`, {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.access_token);
            window.location.href = `${BASE_PATH}/dashboard`;
        } else {
            const error = await response.json();
            errorDiv.querySelector('span').textContent = error.detail || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.querySelector('span').textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
