{% extends "base.html" %}

{% block title %}Settings - CodeForge{% endblock %}

{% block body %}
<div class="min-h-full bg-gradient-to-br from-gray-900 via-black to-gray-900">
    <!-- Top Navigation Bar -->
    <nav class="codeforge-header text-white px-4 py-3 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <a href="/code/dashboard" class="text-xl font-bold flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer">
                <i class="fas fa-code text-forge-green-400"></i>
                <span class="text-gradient-green">CodeForge</span>
            </a>
            <span class="text-sm text-gray-400 flex items-center gap-2">
                <i class="fas fa-cog"></i>
                Settings
            </span>
        </div>

        <div class="flex items-center space-x-4">
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg text-sm transition-all flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </nav>

    <!-- Settings Content -->
    <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="bg-gray-900 border border-gray-800 shadow-2xl rounded-2xl">
            <!-- Header -->
            <div class="px-6 py-4 border-b border-gray-800">
                <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-user-cog text-forge-green-400"></i>
                    Account Settings
                </h2>
            </div>

            <!-- Change Password Section -->
            <div class="px-6 py-6">
                <h3 class="text-lg font-medium text-white mb-4 flex items-center gap-2">
                    <i class="fas fa-key text-forge-green-400"></i>
                    Change Password
                </h3>

                <form id="changePasswordForm" class="space-y-4 max-w-md">
                    <div>
                        <label for="currentPassword" class="block text-sm font-medium text-gray-300 flex items-center gap-2">
                            <i class="fas fa-lock text-forge-green-400"></i>
                            Current Password
                        </label>
                        <div class="mt-1">
                            <input id="currentPassword" name="currentPassword" type="password" required
                                class="appearance-none block w-full px-4 py-3 border border-gray-700 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-forge-green-500 focus:border-forge-green-500 bg-gray-800 text-white sm:text-sm transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="newPassword" class="block text-sm font-medium text-gray-300 flex items-center gap-2">
                            <i class="fas fa-key text-forge-green-400"></i>
                            New Password
                        </label>
                        <div class="mt-1">
                            <input id="newPassword" name="newPassword" type="password" required
                                class="appearance-none block w-full px-4 py-3 border border-gray-700 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-forge-green-500 focus:border-forge-green-500 bg-gray-800 text-white sm:text-sm transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-300 flex items-center gap-2">
                            <i class="fas fa-check-double text-forge-green-400"></i>
                            Confirm New Password
                        </label>
                        <div class="mt-1">
                            <input id="confirmPassword" name="confirmPassword" type="password" required
                                class="appearance-none block w-full px-4 py-3 border border-gray-700 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-forge-green-500 focus:border-forge-green-500 bg-gray-800 text-white sm:text-sm transition-all">
                        </div>
                    </div>

                    <div id="errorMessage" class="hidden text-red-400 text-sm bg-red-900/20 border border-red-800 rounded-lg p-3 flex items-center gap-2">
                        <i class="fas fa-exclamation-circle"></i>
                        <span></span>
                    </div>
                    <div id="successMessage" class="hidden text-forge-green-400 text-sm bg-forge-green-900/20 border border-forge-green-800 rounded-lg p-3 flex items-center gap-2">
                        <i class="fas fa-check-circle"></i>
                        <span></span>
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-gradient-to-r from-forge-green-600 to-forge-green-700 hover:from-forge-green-500 hover:to-forge-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forge-green-500 transition-all hover:-translate-y-0.5 shadow-forge-green-900/50">
                            <i class="fas fa-save"></i>
                            Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Detect if we're running under /code/ prefix
const BASE_PATH = window.location.pathname.startsWith('/code/') ? '/code' : '';

function logout() {
    localStorage.removeItem('token');
    window.location.href = `${BASE_PATH}/login`;
}

document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    
    // Hide previous messages
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    
    // Validate passwords match
    if (newPassword !== confirmPassword) {
        errorDiv.querySelector('span').textContent = 'New passwords do not match';
        errorDiv.classList.remove('hidden');
        return;
    }

    // Validate password length
    if (newPassword.length < 6) {
        errorDiv.querySelector('span').textContent = 'New password must be at least 6 characters';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    try {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = `${BASE_PATH}/login`;
            return;
        }
        
        const response = await fetch(`${BASE_PATH}/api/auth/change-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                current_password: currentPassword,
                new_password: newPassword
            })
        });

        if (response.ok) {
            successDiv.querySelector('span').textContent = 'Password changed successfully!';
            successDiv.classList.remove('hidden');
            // Clear form
            document.getElementById('changePasswordForm').reset();
        } else {
            const error = await response.json();
            errorDiv.querySelector('span').textContent = error.detail || 'Failed to change password';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.querySelector('span').textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
