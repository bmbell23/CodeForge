<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}CodeForge{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png" id="favicon">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json" id="manifest">
    <meta name="theme-color" content="#10b981">

    <!-- Apple Touch Icon (for iOS home screen) -->
    <link rel="apple-touch-icon" href="/static/app_icon.png" id="apple-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/app_icon.png" id="apple-icon-180">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/app_icon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/app_icon.png">
    <link rel="apple-touch-icon-precomposed" href="/static/app_icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CodeForge">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'forge-green': {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js for interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css" id="main-css">

    {% block extra_head %}{% endblock %}

    <!-- Dynamic path detection script -->
    <script>
        // Detect if we're running under /code/ prefix and update static file paths
        const BASE_PATH = window.location.pathname.startsWith('/code/') ? '/code' : '';

        // Function to update paths
        function updateStaticPaths() {
            // Update favicon and icons
            const favicon = document.getElementById('favicon');
            const manifest = document.getElementById('manifest');
            const appleIcon = document.getElementById('apple-icon');
            const appleIcon180 = document.getElementById('apple-icon-180');
            const mainCss = document.getElementById('main-css');

            if (favicon) favicon.href = BASE_PATH + '/static/favicon.png';
            if (manifest) manifest.href = BASE_PATH + '/static/manifest.json';
            if (appleIcon) appleIcon.href = BASE_PATH + '/static/app_icon.png';
            if (appleIcon180) appleIcon180.href = BASE_PATH + '/static/app_icon.png';
            if (mainCss) mainCss.href = BASE_PATH + '/static/css/main.css';
        }

        // Update paths when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateStaticPaths);
        } else {
            updateStaticPaths();
        }
    </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900">
    {% block body %}{% endblock %}

    <!-- Custom JS -->
    <script>
        // Load main.js with correct path
        const script = document.createElement('script');
        script.src = BASE_PATH + '/static/js/main.js';
        document.head.appendChild(script);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
