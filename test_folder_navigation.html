<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Folder Navigation</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .folder { 
            padding: 10px; 
            margin: 5px 0; 
            background: #f0f0f0; 
            cursor: pointer; 
            border-radius: 4px;
        }
        .folder:hover { background: #e0e0e0; }
        .folder.clicked { background: #d0d0d0; }
        .debug { 
            background: #f9f9f9; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test Folder Navigation</h1>
    
    <div x-data="testApp()">
        <div class="debug">
            <h3>Debug Info:</h3>
            <p>Current Path: <span x-text="currentPath"></span></p>
            <p>Loading: <span x-text="loading"></span></p>
            <p>Last Click: <span x-text="lastClick"></span></p>
        </div>

        <div>
            <h3>Test Folders:</h3>
            <template x-for="folder in testFolders" :key="folder.name">
                <div class="folder" 
                     @click="navigateToFolder(folder.name)"
                     x-data="{ clicking: false }"
                     @mousedown="clicking = true"
                     @mouseup="clicking = false"
                     @mouseleave="clicking = false"
                     :class="{ 'clicked': clicking }">
                    📁 <span x-text="folder.name"></span>
                </div>
            </template>
        </div>

        <div>
            <button @click="testConsoleLog()">Test Console Log</button>
            <button @click="testAlert()">Test Alert</button>
        </div>
    </div>

    <script>
        function testApp() {
            return {
                currentPath: '',
                loading: false,
                lastClick: 'none',
                testFolders: [
                    { name: 'src' },
                    { name: 'docs' },
                    { name: 'tests' },
                    { name: 'config' }
                ],

                navigateToFolder(folderName) {
                    console.log('Folder clicked:', folderName);
                    this.lastClick = folderName + ' at ' + new Date().toLocaleTimeString();
                    this.loading = true;
                    
                    // Simulate async operation
                    setTimeout(() => {
                        this.currentPath = this.currentPath ? 
                            this.currentPath + '/' + folderName : 
                            folderName;
                        this.loading = false;
                        console.log('Navigation complete, new path:', this.currentPath);
                    }, 500);
                },

                testConsoleLog() {
                    console.log('Console log test - this should appear in browser console');
                },

                testAlert() {
                    alert('Alert test - this should show a popup');
                }
            };
        }
    </script>
</body>
</html>
